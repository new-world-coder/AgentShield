[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentshield"
version = "0.2.0"
description = "AgentShield Python SDK — MCP firewall, AgentBOM, Assure oracles, SARIF"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AgentShield Team" }]
keywords = ["ai", "security", "mcp", "agents", "sarif", "agentbom"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]
# Optional richer YAML parsing; a built-in subset parser works without PyYAML.
yaml = ["PyYAML>=6.0"]
[project.scripts]
agentshield = "agentshield.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agentshield*"]

[tool.setuptools.package-data]
agentshield = ["packs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
